name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install numpy scipy jsonschema pyyaml pytest rank-bm25 tokenizers
      - run: python -m pytest -q   # includes tests/test_no_leak.py on every commit
